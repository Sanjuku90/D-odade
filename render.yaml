services:
  - type: web
    name: questinvest
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/lib/questinvest
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/lib/questinvest/questinvest.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEPOSIT_ADDRESS
        sync: false
