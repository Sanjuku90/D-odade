services:
  - type: web
    name: questinvest
    runtime: node
    buildCommand: npm install --production=false
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: questinvest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/questinvest.db
      - key: MIN_DEPOSIT
        value: "150"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEPOSIT_ADDRESS
        sync: false
      - key: MAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
